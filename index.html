@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

.acllar-root {
  --ink: #15302B;
  --ink-2: #1E403A;
  --paper: #E7ECE8;
  --card: #FFFFFF;
  --line: #D7DFDA;
  --muted: #5D6B65;
  --text: #17211E;
  --marigold: #E8A13A;
  --marigold-deep: #C9821F;
  --clay: #C24B3F;
  --teal: #2F8F7C;
  --violet: #6F5AA6;
  --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  font-family: var(--font-body);
  color: var(--text);
  background: var(--paper);
}
.acllar-root .display { font-family: var(--font-display); letter-spacing: -0.02em; }
.acllar-root .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.acllar-root button:focus-visible,
.acllar-root select:focus-visible,
.acllar-root input:focus-visible,
.acllar-root label:focus-within {
  outline: 2px solid var(--marigold);
  outline-offset: 2px;
}
.acllar-ribbon-bar { transition: height .5s cubic-bezier(.2,.7,.2,1); }
.acllar-fade { animation: acllarFade .4s ease both; }
@keyframes acllarFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
