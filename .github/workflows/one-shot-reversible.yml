name: One-shot reversible cleaning repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gestion live cleaning indicator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'activeCleanings,setActiveCleanings' not in s:
              old='[Y,se]=(0,c.useState)(()=>({})),[te,Fe]=(0,c.useState)({}),D=(0,c.useRef)(!1);'
              new='[Y,se]=(0,c.useState)(()=>({})),[te,Fe]=(0,c.useState)({}),D=(0,c.useRef)(!1),[activeCleanings,setActiveCleanings]=(0,c.useState)([]);'
              if old not in s: raise SystemExit('Gestion state marker not found')
              s=s.replace(old,new,1)
              old='''},[He]);let k=(0,c.useCallback)(()=>{'''
              new='''},[He]);
              (0,c.useEffect)(()=>{
                let active=!0;
                let syncActiveCleanings=async()=>{
                  try{
                    let sb=window.__ACLLAR_SUPABASE;
                    let session=(await sb.auth.getSession()).data.session;
                    if(!session?.user)return;
                    let res=await sb.from("limpiezas").select("id,ac_id,tamano,inicio,usuario_id,tramo_inicio_at").eq("estado","en_curso").order("inicio",{ascending:!0});
                    if(res.error)throw res.error;
                    if(active)setActiveCleanings(res.data||[]);
                  }catch(err){console.warn("No se pudieron sincronizar las limpiezas en curso:",err?.message||err)}
                };
                syncActiveCleanings();
                let timer=setInterval(syncActiveCleanings,10000);
                let channel=window.__ACLLAR_SUPABASE?.channel("acllar-gestion-en-curso")
                  .on("postgres_changes",{event:"*",schema:"public",table:"limpiezas"},()=>syncActiveCleanings())
                  .subscribe();
                return()=>{active=!1;clearInterval(timer);if(channel&&window.__ACLLAR_SUPABASE)window.__ACLLAR_SUPABASE.removeChannel(channel)};
              },[]);
              let k=(0,c.useCallback)(()=>{'''
              if old not in s: raise SystemExit('Gestion effect marker not found')
              s=s.replace(old,new,1)
              old='))),c.default.createElement("div",{style:{display:Vn==="calculo"?"block":"none"}}'
              new='))),c.default.createElement("div",{className:"mb-4 rounded-xl px-4 py-3",style:{background:activeCleanings.length?"#E8F7F0":"var(--paper)",border:`1px solid ${activeCleanings.length?"#B8E5D1":"var(--line)"}`}},c.default.createElement("span",{className:"text-sm font-semibold",style:{color:activeCleanings.length?"#0F766E":"var(--muted)"}},activeCleanings.length?`🟢 Limpiezas en curso: ${activeCleanings.map(S=>S.ac_id).join(" · ")}`:"⚪ Ninguna limpieza en curso")),c.default.createElement("div",{style:{display:Vn==="calculo"?"block":"none"}}'
              if old not in s: raise SystemExit('Gestion UI marker not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check Gestion
        run: |
          python - <<'PY'
          import re,subprocess
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I)
          if not scripts: raise SystemExit('No script found')
          for i,js in enumerate(scripts):
              Path('/tmp/check.js').write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check','/tmp/check.js'],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit('JavaScript validation failed')
          print('Syntax OK')
          PY
      - name: Commit and remove one-shot workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-shot-reversible.yml .github/workflows/fix_pause_and_gestion_live.yml
          git commit -m 'Show live Tablet cleanings in Gestion [live-indicator]'
          git push