name: Fix pending order script placement
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move script tag to real body
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/ac-llar-limpieza/orden-pendientes-extra.js?v=1"></script>'
          s=s.replace(tag,'')
          pos=s.rfind('</body>')
          if pos < 0: raise SystemExit('No se encontró </body>')
          s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove installer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-order-script-placement.yml
          git add index.html
          git commit -m 'Corregir ubicacion del panel de pendientes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
