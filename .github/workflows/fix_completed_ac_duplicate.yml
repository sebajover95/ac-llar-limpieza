name: Fix completed cleaning duplicate
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fix-completed-duplicate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical cleaning key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker='DUPLICATE-CLEANING-CANONICAL-KEY-V2'
          if marker in s:
              raise SystemExit('Patch already present; nothing to do.')

          # The generated HTML is minified, so patch stable code fragments rather than line breaks.
          pat1=r'(let cleaned=\{\.\.\.\(dia\.cleaned\|\|\{\}\)\};)'
          ins1=r'''\1
          // DUPLICATE-CLEANING-CANONICAL-KEY-V2
          let normalKey=`${row.ac_id}|${fecha}`;
          let forcedPrefix=`F|${row.ac_id}|${fecha}|`;
          Object.keys(cleaned).forEach(existingKey=>{
            if(existingKey!==taskKey && String(cleaned[existingKey])===String(row.ac_id) &&
              (existingKey===normalKey || existingKey.startsWith(forcedPrefix))){
              delete cleaned[existingKey];
              changedDia=true;
            }
          });'''
          s,n1=re.subn(pat1,ins1,s,count=1)
          if n1!=1:
              raise SystemExit('No se encontró el bloque cleaned esperado; no se modifica nada.')

          pat2=r'(let taskKey=forced\?\.key\|\|`\$\{row\.ac_id\}\|\$\{fecha\}`;)'
          # There are two occurrences. We only need the second one for the limpieza-done Map.
          matches=list(re.finditer(pat2,s))
          if len(matches)<2:
              raise SystemExit(f'Se esperaban dos asignaciones taskKey y se encontraron {len(matches)}.')
          pos=matches[-1].end()
          ins2=r'''
          let normalKey=`${row.ac_id}|${fecha}`;
          let forcedPrefix=`F|${row.ac_id}|${fecha}|`;
          for(let existingKey of [...next.keys()]){
            if(existingKey!==taskKey && (existingKey===normalKey || existingKey.startsWith(forcedPrefix))){
              next.delete(existingKey);
              changed=true;
            }
          }'''
          s=s[:pos]+ins2+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if 'DUPLICATE-CLEANING-CANONICAL-KEY-V2' not in s:
              raise SystemExit('Patch marker missing')
          js=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(js),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix_completed_ac_duplicate.yml
          git commit -m 'Fix completed cleaning duplicate [fix-completed-duplicate]'
          git push
