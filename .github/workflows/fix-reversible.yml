name: Fix reversible cleaning cycle
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[reversible-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Gestión: cancelar una limpieza terminada debe devolver SIEMPRE el AC al plan pendiente.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='REVERSIBLE-CANCEL-ALL'
          if marker not in s:
              pat=re.compile(r'\n\s*// Si la limpieza eliminada provenía de una FORZADA.*?\n\s*\}\n\s*\}\s*catch\(err\)',re.S)
              repl='''\n    // REVERSIBLE-CANCEL-ALL\n    // Al anular una limpieza terminada, el AC debe volver al plan pendiente,\n    // independientemente de que fuese normal o forzada.\n    let resetPlan=await sb.from("limpieza_plan")\n      .update({estado:"pendiente"})\n      .eq("fecha",fecha)\n      .eq("ac_id",String(O));\n    if(resetPlan.error)throw resetPlan.error;\n  }catch(err)'''
              ns,n=pat.subn(repl,s,count=1)
              if n!=1:
                  raise SystemExit('No se encontró el bloque de cancelación de Gestión')
              s=ns
              p.write_text(s,encoding='utf-8')

          # Tablet: leer el primer día que tenga realmente pendientes, no el primer día con filas terminadas.
          p=Path('tablet/index.html')
          s=p.read_text(encoding='utf-8')
          marker2='REVERSIBLE-TABLET-PENDING-DAY'
          if marker2 not in s:
              pat=re.compile(r'async function p3\(\)\{.*?\}\s*var v3=',re.S)
              repl='''async function p3(){\n  let today=_v(h3());\n  let {data,error}=await supabaseClient.from("limpieza_plan").select("id,fecha,ac_id,tamano,estado").eq("fecha",today).order("ac_id",{ascending:!0});\n  if(error)throw new Error("No se pudo leer el plan de limpieza: "+error.message);\n  let fecha=today;\n  let rows=(data||[]).filter(u=>u.estado!=="terminada");\n  if(!rows.length){\n    let next=await supabaseClient.from("limpieza_plan").select("id,fecha,ac_id,tamano,estado").gt("fecha",today).order("fecha",{ascending:!0}).order("ac_id",{ascending:!0}).limit(200);\n    if(next.error)throw new Error("No se pudo leer el próximo plan de limpieza: "+next.error.message);\n    rows=(next.data||[]).filter(u=>u.estado!=="terminada");\n    if(rows.length)fecha=rows[0].fecha;\n  }\n  return{fecha,items:rows.map(u=>({id:u.ac_id,tamano:u.tamano||"Grande",planId:u.id,planEstado:u.estado}))}\n}\n// REVERSIBLE-TABLET-PENDING-DAY\nvar v3='''
              ns,n=pat.subn(repl,s,count=1)
              if n!=1:
                  raise SystemExit('No se encontró la función p3 de Tablet')
              s=ns
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['index.html','tablet/index.html']:
              s=Path(f).read_text(encoding='utf-8')
              assert '<html' in s and '</html>' in s, f
              assert 'REVERSIBLE-' in s, f
          PY
      - name: Publish patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tablet/index.html
          git rm .github/workflows/fix-reversible.yml
          git commit -m 'Fix reversible cleaning cycle [reversible-fix]'
          git push
