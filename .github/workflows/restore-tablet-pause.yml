name: Restore Tablet pause
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[tablet-pause-restored]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pause and resume controls
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('tablet/index.html')
          s = p.read_text(encoding='utf-8')

          # Handlers: pause/resume through the existing Supabase RPCs.
          marker = 'let C=j=>{l(j),r("terminar")};'
          handlers = '''let C=j=>{l(j),r("terminar")};
          let pauseSession=async id=>{let local=t.find(xe=>xe.id===id);if(!local||local.estado!=="en_curso")return;let now=Date.now();let accumulated=Math.max(0,Number(local.tiempoAcumuladoSegundos||0)+Math.max(0,now-Number(local.tramoInicioAt||local.inicio||now))/1000);if(!local.dbId){alert("No se pudo pausar la limpieza: falta el identificador de Supabase.");return}let {error}=await supabaseClient.rpc("pausar_limpieza",{p_limpieza_id:local.dbId,p_tiempo_acumulado_segundos:Math.round(accumulated),p_pausada_at:new Date(now).toISOString()});if(error){alert("No se pudo pausar la limpieza: "+error.message);return}n(J=>J.map(xe=>xe.id===id?{...xe,estado:"pausada",tiempoAcumuladoSegundos:Math.round(accumulated),pausadaAt:now,tramoInicioAt:null}:xe))};
          let resumeSession=async id=>{let local=t.find(xe=>xe.id===id);if(!local||local.estado!=="pausada")return;let now=Date.now();if(!local.dbId){alert("No se pudo retomar la limpieza: falta el identificador de Supabase.");return}let {error}=await supabaseClient.rpc("retomar_limpieza",{p_limpieza_id:local.dbId,p_tramo_inicio_at:new Date(now).toISOString()});if(error){alert("No se pudo retomar la limpieza: "+error.message);return}n(J=>J.map(xe=>xe.id===id?{...xe,estado:"en_curso",tramoInicioAt:now,pausadaAt:null}:xe))};'''
          if marker not in s:
              raise SystemExit('No se encontró el punto de inserción de los handlers de pausa')
          if 'let pauseSession=async id=>' not in s:
              s = s.replace(marker, handlers, 1)

          # Pass pause/resume handlers down to the active-cleaning panel.
          old = 'onTerminar:C,onCancelar:I}),e==="elegir"'
          new = 'onTerminar:C,onPausar:pauseSession,onRetomar:resumeSession,onCancelar:I}),e==="elegir"'
          if old not in s:
              raise SystemExit('No se encontró la llamada a E3')
          s = s.replace(old, new, 1)

          # Replace E3 so each active session knows whether it is running or paused.
          old_e3 = '''function E3({enCurso:e,terminadas:r,tick:t,necesitaCargar:n,onEmpezar:a,onCargarPlan:i,onTerminar:s,onCancelar:l}){'''
          new_e3 = '''function E3({enCurso:e,terminadas:r,tick:t,necesitaCargar:n,onEmpezar:a,onCargarPlan:i,onTerminar:s,onPausar:pause,onRetomar:resume,onCancelar:l}){'''
          if old_e3 not in s:
              raise SystemExit('No se encontró E3')
          s = s.replace(old_e3, new_e3, 1)

          old_map = 'onTerminar:()=>s(o.id),onCancelar:()=>l(o.id)'
          new_map = 'onTerminar:()=>s(o.id),onPausar:()=>pause(o.id),onRetomar:()=>resume(o.id),onCancelar:()=>l(o.id)'
          if old_map not in s:
              raise SystemExit('No se encontró el mapa de sesiones activas')
          s = s.replace(old_map, new_map, 1)

          # Replace the active-session card with a pause/resume-aware version.
          pattern = r'function S3\(\{sesion:e,tick:r,onTerminar:t,onCancelar:n\}\)\{.*?\}function T3'
          replacement = '''function S3({sesion:e,tick:r,onTerminar:t,onPausar:pause,onRetomar:resume,onCancelar:n}){let a=Number(e.tiempoAcumuladoSegundos||0)*1000+(e.estado==="en_curso"?Math.max(0,Date.now()-Number(e.tramoInicioAt||e.inicio||Date.now())):0);return B.default.createElement("div",{className:"rounded-2xl p-4",style:{background:"#fff",border:`2px solid ${e.estado==="pausada"?"var(--violet)":"var(--marigold)"}`}},B.default.createElement("div",{className:"flex items-center gap-3"},B.default.createElement("div",{className:"flex-1"},B.default.createElement("div",{className:"text-2xl font-bold mono"},e.acId),B.default.createElement("div",{className:"text-xs",style:{color:"var(--muted)"}},e.tamano," · ",e.estado==="pausada"?"PAUSADA desde "+Dl(e.pausadaAt||Date.now()):"en curso · empezó a las "+Dl(e.inicio))),B.default.createElement("div",{className:"text-right"},B.default.createElement("div",{className:"mono font-bold text-3xl",style:{color:e.estado==="pausada"?"var(--violet)":"var(--marigold-deep)"}},Nl(a)),B.default.createElement("div",{className:"text-[10px]",style:{color:"var(--muted)"}},"tiempo efectivo"))),B.default.createElement("div",{className:"mt-3 flex gap-2"},e.estado==="pausada"?B.default.createElement("button",{onClick:()=>resume(e.id),className:"flex-1 text-white font-bold text-lg py-4 rounded-xl inline-flex items-center justify-center gap-2",style:{background:"var(--violet)"}},"▶ RETOMAR"):B.default.createElement("button",{onClick:()=>pause(e.id),className:"flex-1 text-white font-bold text-lg py-4 rounded-xl inline-flex items-center justify-center gap-2",style:{background:"var(--marigold-deep)"}},"Ⅱ PAUSAR"),B.default.createElement("button",{onClick:t,className:"flex-1 text-white font-bold text-lg py-4 rounded-xl inline-flex items-center justify-center gap-2",style:{background:"var(--clay)"}},B.default.createElement(v3,{width:"22",height:"22"})," TERMINAR"),B.default.createElement("button",{onClick:n,className:"px-4 rounded-xl",style:{background:"var(--paper)",color:"var(--muted)",border:"1px solid var(--line)"},title:"Cancelar sin guardar"},B.default.createElement(g3,{width:"18",height:"18"}))))}function T3'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('No se pudo reemplazar la tarjeta S3')
          s = s2

          p.write_text(s, encoding='utf-8')
          print('Tablet pause/resume restored')

      - name: Validate pause code
        shell: python
        run: |
          from pathlib import Path
          s=Path('tablet/index.html').read_text(encoding='utf-8')
          required=['pausar_limpieza','retomar_limpieza','onPausar:()=>pause(o.id)','onRetomar:()=>resume(o.id)','"PAUSAR"','"RETOMAR"']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Faltan elementos: '+', '.join(missing))
          print('OK: controles y RPCs de pausa presentes')

      - name: Commit
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add tablet/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restaurar pausa y reanudación en Tablet [tablet-pause-restored]"
          git push