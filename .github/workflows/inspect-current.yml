name: Inspect current pending code
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[pending-inspect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['activeCleanings','manualReturns','limpieza-retornos-manuales','let fl=(0,c.useCallback)','for(let G of Z.data){','if(Z.data.length&&le&&Object.keys(le).length)','let or=[],dl=[]']:
              print('\nNEEDLE',needle,'COUNT',s.count(needle))
              i=s.find(needle)
              if i>=0: print(s[max(0,i-1200):i+5000])
          PY