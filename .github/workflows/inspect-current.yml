name: Inspect current pending code
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[pending-inspect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect active cleaning usage
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['fl=(0,c.useCallback','activeCleanings','setActiveCleanings','limpiezas','en_curso']:
              print('\nNEEDLE',needle,'COUNT',s.count(needle))
              start=0
              n=0
              while n<8:
                  i=s.find(needle,start)
                  if i<0: break
                  print('\n---MATCH',n,'---\n',s[max(0,i-700):i+1800])
                  start=i+1; n+=1
          PY