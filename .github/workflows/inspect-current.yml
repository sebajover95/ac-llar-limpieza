name: Inspect current pending code
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[pending-inspect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect callback
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['fl=(0,c.useCallback','useCallback)(()=>{if(!z.data','},[z,Z','manualReturnsLoaded.current&&z.data.length&&Z.data.length&&fl()','limpieza_plan']:
              print('\nNEEDLE',needle,'COUNT',s.count(needle))
              i=s.find(needle)
              if i>=0: print(s[max(0,i-1000):i+3500])
          PY