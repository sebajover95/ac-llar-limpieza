name: Inspect current pending code
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[pending-inspect-auto]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect return filter
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['manualReturns[ne]','ve===_t()','latestByAc','let Na=mr||info.ret','limpieza-retornos-manuales']:
              print('\nNEEDLE',needle,'COUNT',s.count(needle))
              i=s.find(needle)
              if i>=0: print(s[max(0,i-3000):i+6000])
          PY