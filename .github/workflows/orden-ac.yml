name: Restaurar aplicación estable

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[restore-ac]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar index estable
        shell: bash
        run: |
          git checkout 866c06f901fa104a2f8800e6d384bd39acfd1020 -- index.html
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add index.html
          git commit -m "Restaurar página estable [restore-ac]" || exit 0
          git push
