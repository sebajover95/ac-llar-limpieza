name: Restaurar aplicación estable

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[restored-ac]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar index estable
        shell: bash
        run: |
          git checkout 523274c4127d0d6d837116b8a93b629dfba10a3d -- index.html
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add index.html
          git commit -m "Restaurar página estable [restored-ac]" || exit 0
          git push
