name: Inspect pending source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract pending source
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for needle in ['let fl=', 'let Es=or.filter', 'limpieza-retornos-manuales']:
              i=s.find(needle)
              out.append('\n=== '+needle+' ===\n'+(s[max(0,i-2500):i+9000] if i>=0 else 'NOT FOUND'))
          Path('debug-pending-source.txt').write_text(''.join(out),encoding='utf-8')
      - name: Commit debug source
        run: |
          git config user.name 'github-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug-pending-source.txt
          git commit -m 'debug pending source' || exit 0
          git push
