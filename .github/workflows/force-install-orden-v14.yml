name: Force install order panel v14
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: "!contains(github.event.head_commit.message, '[orden-v14]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install order script
        shell: python
        run: |
          from pathlib import Path
          import re
          tag = '<script src="/ac-llar-limpieza/orden-ac.js?v=14"></script>'
          for name in ['index.html', 'tablet/index.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<script[^>]+src=["\']/ac-llar-limpieza/orden-ac\.js[^>]*></script>', '', s)
              pos = s.rfind('</body>')
              if pos < 0:
                  raise SystemExit(f'No se encontró </body> en {name}')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add index.html tablet/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Instalar panel de prioridad y estados [orden-v14]"
          git push
