name: Harden Tablet sessions v4

on:
  push:
    branches: [main]

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[tablet-hardening-v4]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Tablet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tablet/index.html')
          s=p.read_text(encoding='utf-8')

          effect='''(0,B.useEffect)(()=>{
            if(!authUser)return;
            let active=!0;
            let loadSessions=async()=>{
              let {data,error}=await supabaseClient.from("limpiezas").select("id,ac_id,tamano,empresa,nombre,inicio,fin,estado,usuario_id,tiempo_acumulado_segundos,pausada_at,tramo_inicio_at").in("estado",["en_curso","pausada"]).order("inicio",{ascending:!1});
              if(error){console.error("No se pudieron recuperar las sesiones activas:",error.message);return}
              if(!active)return;
              let rows=(data||[]).map(u=>({id:u.estado==="pausada"?`P|${u.id}`:`S|${u.id}`,dbId:u.id,acId:u.ac_id,tamano:u.tamano||"Grande",empresa:u.empresa||null,nombre:u.nombre||null,inicio:u.inicio?new Date(u.inicio).getTime():Date.now(),fin:null,estado:u.estado,tiempoAcumuladoSegundos:Number(u.tiempo_acumulado_segundos||0),pausadaAt:u.pausada_at?new Date(u.pausada_at).getTime():null,tramoInicioAt:u.estado==="en_curso"?(u.tramo_inicio_at?new Date(u.tramo_inicio_at).getTime():(u.inicio?new Date(u.inicio).getTime():Date.now())):null}));
              n(prev=>[...prev.filter(x=>x.estado!=="en_curso"&&x.estado!=="pausada"),...rows]);
            };
            loadSessions();
            let timer=setInterval(loadSessions,5000);
            return()=>{active=!1;clearInterval(timer)};
          },[authUser]);'''
          marker='let login=async()=>'
          if effect not in s:
              if marker not in s: raise SystemExit('login marker not found')
              s=s.replace(marker,effect+marker,1)

          pat=r'let I=async j=>\{.*?\n\};\s*let b='
          repl='''let I=async j=>{
            let local=t.find(xe=>xe.id===j);
            if(!local)return;
            if(!window.confirm(`ATENCION\\n\\nVas a CANCELAR la limpieza de ${local.acId}.\\nSe perdera el tiempo acumulado y la limpieza volvera a quedar disponible.`))return;
            if(!window.confirm(`CONFIRMACION FINAL\\n\\nSeguro que quieres borrar la limpieza activa de ${local.acId}?\\n\\nPulsa Aceptar solo si realmente quieres reiniciarla desde cero.`))return;
            let q=supabaseClient.from("limpiezas").delete();
            q=local.dbId?q.eq("id",local.dbId):q.eq("ac_id",local.acId).in("estado",["en_curso","pausada"]);
            let {error}=await q;
            if(error){alert("NO SE PUDO CANCELAR LA LIMPIEZA.\\n\\n"+error.message);return}
            let {error:planError}=await supabaseClient.from("limpieza_plan").update({estado:"pendiente"}).eq("ac_id",local.acId).eq("estado","en_curso");
            if(planError)console.warn("No se pudo devolver el plan a pendiente:",planError.message);
            n(ae=>ae.filter(J=>J.id!==j));
          };
          let b='''
          s2,c=re.subn(pat,repl,s,count=1,flags=re.S)
          if c!=1: raise SystemExit('cancel handler not found')
          s=s2

          old='let X=j=>{window.confirm("¿Eliminar esta entrada del historial?")&&n(ae=>ae.filter(J=>J.id!==j))};'
          new='''let X=j=>{
            if(!window.confirm("ATENCION\\n\\nVas a eliminar esta entrada del historial de la Tablet.\\nEsta accion no debe usarse para cancelar una limpieza activa."))return;
            if(!window.confirm("CONFIRMACION FINAL\\n\\nSeguro que quieres eliminar esta entrada del historial?"))return;
            n(ae=>ae.filter(J=>J.id!==j));
          };'''
          if old not in s: raise SystemExit('history delete handler not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('tablet/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/tablet.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/tablet.js
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/harden_tablet_v4.yml HARDEN_TABLET_TRIGGER.txt
          git add tablet/index.html .github/workflows/harden_tablet_v4.yml HARDEN_TABLET_TRIGGER.txt
          git commit -m "Harden Tablet sessions [tablet-hardening-v4]"
          git push
