name: Fix changedDia initialization

on:
  push:
    branches:
      - main

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''let cleaned={...(dia.cleaned||{})};\n// DUPLICATE-CLEANING-CANONICAL-KEY-V2\nlet normalKey=`${row.ac_id}|${fecha}`;\nlet forcedPrefix=`F|${row.ac_id}|${fecha}|`;\nObject.keys(cleaned).forEach(existingKey=>{\n  if(existingKey!==taskKey && String(cleaned[existingKey])===String(row.ac_id) &&\n    (existingKey===normalKey || existingKey.startsWith(forcedPrefix))){\n    delete cleaned[existingKey];\n    changedDia=true;\n  }\n});\n          let tamanoPorAc={...(dia.tamanoPorAc||{})};\n          let tiemposPorAc={...(dia.tiemposPorAc||{})};\n          let changedDia=false;'''
          new='''let cleaned={...(dia.cleaned||{})};\n          let changedDia=false;\n// DUPLICATE-CLEANING-CANONICAL-KEY-V2\nlet normalKey=`${row.ac_id}|${fecha}`;\nlet forcedPrefix=`F|${row.ac_id}|${fecha}|`;\nObject.keys(cleaned).forEach(existingKey=>{\n  if(existingKey!==taskKey && String(cleaned[existingKey])===String(row.ac_id) &&\n    (existingKey===normalKey || existingKey.startsWith(forcedPrefix))){\n    delete cleaned[existingKey];\n    changedDia=true;\n  }\n});\n          let tamanoPorAc={...(dia.tamanoPorAc||{})};\n          let tiemposPorAc={...(dia.tiemposPorAc||{})};'''
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script[^>]*>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script not found')
          open('/tmp/app.js','w',encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix changedDia initialization [fix-changeddia]'
          git push
