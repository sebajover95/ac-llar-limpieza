name: Fix changedDia initialization

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fix-changeddia]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Move changedDia initialization before first use
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''let cleaned={...(dia.cleaned||{})};
// DUPLICATE-CLEANING-CANONICAL-KEY-V2
let normalKey=`${row.ac_id}|${fecha}`;
let forcedPrefix=`F|${row.ac_id}|${fecha}|`;
Object.keys(cleaned).forEach(existingKey=>{
  if(existingKey!==taskKey && String(cleaned[existingKey])===String(row.ac_id) &&
    (existingKey===normalKey || existingKey.startsWith(forcedPrefix))){
    delete cleaned[existingKey];
    changedDia=true;
  }
});
          let tamanoPorAc={...(dia.tamanoPorAc||{})};
          let tiemposPorAc={...(dia.tiemposPorAc||{})};
          let changedDia=false;'''
          new = '''let cleaned={...(dia.cleaned||{})};
          let changedDia=false;
// DUPLICATE-CLEANING-CANONICAL-KEY-V2
let normalKey=`${row.ac_id}|${fecha}`;
let forcedPrefix=`F|${row.ac_id}|${fecha}|`;
Object.keys(cleaned).forEach(existingKey=>{
  if(existingKey!==taskKey && String(cleaned[existingKey])===String(row.ac_id) &&
    (existingKey===normalKey || existingKey.startsWith(forcedPrefix))){
    delete cleaned[existingKey];
    changedDia=true;
  }
});
          let tamanoPorAc={...(dia.tamanoPorAc||{})};
          let tiemposPorAc={...(dia.tiemposPorAc||{})};'''
          if old not in s:
              raise SystemExit('target block not found; aborting without changes')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check <(python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script[^>]*>([\s\S]*?)</script>',s)
          print(m.group(1) if m else '')
          PY
          )

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix changedDia initialization [fix-changeddia]'
          git push
