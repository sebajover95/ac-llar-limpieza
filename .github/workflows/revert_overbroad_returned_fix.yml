name: Revert overbroad returned-vehicle cleaning fix
on:
  push:
    paths:
      - '.github/workflows/revert_overbroad_returned_fix.yml'

jobs:
  revert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Revert only the overbroad salens patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''saleItem={id:G.id,tamano:(Sf(`${U.get(G.id)||""} ${S.get(G.id)||""}`)||{}).nombre||"\\u2014",modelo:U.get(G.id)||"",estado:xe,cleanedOn:ve},Gr[ne].salen.push(saleItem),xe==="limpia_hoy"&&!Gr[ne].items.some(qa=>String(qa.id)===String(G.id))&&Gr[ne].items.push({key:`${G.id}|${ne}`,id:G.id,modelo:U.get(G.id)||"",tamano:saleItem.tamano,peso:1,category:"urgente",margenDias:0,nextDep:G.dep,arrastrada:!1,forzada:!1,movedFrom:null,hecha:!1})'''
          new = '''Gr[ne].salen.push({id:G.id,tamano:(Sf(`${U.get(G.id)||""} ${S.get(G.id)||""}`)||{}).nombre||"\\u2014",modelo:U.get(G.id)||"",estado:xe,cleanedOn:ve})'''
          if old not in s:
              raise SystemExit('Expected overbroad patch not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/revert_overbroad_returned_fix.yml
          git commit -m 'Restore returned vehicle classification' || exit 0
          git rm .github/workflows/revert_overbroad_returned_fix.yml
          git commit -m 'Remove one-shot revert workflow'
          git push
