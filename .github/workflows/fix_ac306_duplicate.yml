name: Fix AC-306 duplicate

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fix-ac306]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch duplicate rows
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''let Ie={};Object.values(ke.cleaned).forEach(ge=>{Ie[ge]=(Ie[ge]||0)+1}),Object.entries(ke.cleaned).forEach(([ge,Ge])=>{let Qe=`${Ge}|${fe}`,It=te[Ge]||ke.tamanoPorAc&&ke.tamanoPorAc[Ge]||"Grande";let tiempo=ke.tiemposPorAc&&ke.tiemposPorAc[Ge]||null;\nre.push({dk:fe,id:Ge,tamano:It,taskKey:ge,empresa:O[Qe]||tiempo?.empresa||"",persona:Q[Qe]||tiempo?.nombre||"",tiempo,duplicada:Ie[Ge]>1})})'''
          new = '''let seenIds=new Set;Object.entries(ke.cleaned).forEach(([ge,Ge])=>{if(seenIds.has(Ge))return;seenIds.add(Ge);let Qe=`${Ge}|${fe}`,It=te[Ge]||ke.tamanoPorAc&&ke.tamanoPorAc[Ge]||"Grande";let tiempo=ke.tiemposPorAc&&ke.tiemposPorAc[Ge]||null;\nre.push({dk:fe,id:Ge,tamano:It,taskKey:ge,empresa:O[Qe]||tiempo?.empresa||"",persona:Q[Qe]||tiempo?.nombre||"",tiempo,duplicada:false})})'''
          if old not in s:
              raise SystemExit('PATCH_TARGET_NOT_FOUND')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('AC306_DEDUP_PATCH_APPLIED')

      - name: Syntax check
        run: |
          node --check index.html

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix_ac306_duplicate.yml
          git commit -m "Fix AC duplicate rows [fix-ac306]"
          git push
