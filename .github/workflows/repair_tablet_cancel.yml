name: Repair Tablet cancel cleanup

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[tablet-cancel-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Tablet cancel handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tablet/index.html')
          s=p.read_text(encoding='utf-8')
          old='let I=j=>{window.confirm("¿Cancelar esta limpieza en curso? No se registrará.")&&n(ae=>ae.filter(J=>J.id!==j))};'
          new='let I=async j=>{if(!window.confirm("¿Cancelar esta limpieza en curso? No se registrará."))return;let local=t.find(xe=>xe.id===j);if(!local)return;try{let q=supabaseClient.from("limpiezas").delete();q=local.dbId?q.eq("id",local.dbId):q.eq("ac_id",local.acId).eq("usuario_id",authUser.id).eq("estado","en_curso");let {error}=await q;if(error)throw error;let {error:planError}=await supabaseClient.from("limpieza_plan").update({estado:"pendiente"}).eq("fecha",p).eq("ac_id",local.acId).eq("estado","en_curso");if(planError)console.warn("No se pudo devolver el plan a pendiente:",planError.message);n(ae=>ae.filter(J=>J.id!==j));}catch(err){alert("No se pudo cancelar la limpieza: "+(err.message||err));}};'
          if old not in s:
              raise SystemExit('Expected Tablet cancel handler not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('tablet/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script[^>]*>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('No script found')
          Path('/tmp/tablet-check.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/tablet-check.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tablet/index.html
          git commit -m "Fix Tablet cancel cleanup [tablet-cancel-fix]"
          git push
