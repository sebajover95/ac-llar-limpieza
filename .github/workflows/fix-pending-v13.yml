name: Fix automatic pending architecture
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[pending-v13]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pending calculation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changes=0
          old='Tf.length&&Wr.push(`Ojo: ${Tf.join(" · ")} vuelve(n) en fin de semana y sale(n) sin un día laborable de por medio. Se programa(n) el laborable más cercano, pero puede no dar tiempo.`);let latestCleanedByAc='
          new='Tf.length&&Wr.push(`Ojo: ${Tf.join(" · ")} vuelve(n) en fin de semana y sale(n) sin un día laborable de por medio. Se programa(n) el laborable más cercano, pero puede no dar tiempo.`);let activeCleaningIds=new Set((activeCleanings||[]).map(S=>String(S.ac_id).trim().toUpperCase()));let latestCleanedByAc='
          if old in s: s=s.replace(old,new,1); changes+=1
          old='let xe=(Kt.get(G.id)||[]).find(i2=>i2>=G.ret)||null;if(xe&&xe<cn)continue;let ve,De;'
          new='let xe=(Kt.get(G.id)||[]).find(i2=>i2>=G.ret)||null;let ve,De;'
          if old in s: s=s.replace(old,new,1); changes+=1
          old='let or=[],dl=[];for(let G of Ef){let lc=latestCleanedByAc.get(G.id);(W.has(G.key)||(lc&&G.release&&lc>=G.release)?dl:or).push(G);}'
          new='let or=[],dl=[];for(let G of Ef){let norm=String(G.id||"").trim().toUpperCase();if(activeCleaningIds.has(norm))continue;let lc=latestCleanedByAc.get(G.id);(W.has(G.key)||(lc&&G.release&&lc>=G.release)?dl:or).push(G);}'
          if old in s: s=s.replace(old,new,1); changes+=1
          p.write_text(s,encoding='utf-8')
          print('changes',changes)
          if changes<3: raise SystemExit('Pending architecture markers not found')
          PY
      - name: Sync and commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finish automatic pending architecture [pending-v13]"
          git pull --rebase origin main
          git push origin HEAD:main