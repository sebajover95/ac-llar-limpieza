name: Instalar orden manual AC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: "!contains(github.event.head_commit.message, '[orden-v12]') && !contains(github.event.head_commit.message, 'pending')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar script de orden v12
        shell: python
        run: |
          from pathlib import Path
          import re
          tag = '<script src="/ac-llar-limpieza/orden-ac.js?v=12"></script>'
          for name in ['index.html', 'tablet/index.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<script[^>]+src=["\']/ac-llar-limpieza/orden-ac\.js[^>]*></script>', '', s)
              pos = s.rfind('</body>')
              if pos < 0: raise SystemExit(f'No se encontró </body> en {name}')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add index.html tablet/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Instalar orden manual AC [orden-v12]"
          git push
