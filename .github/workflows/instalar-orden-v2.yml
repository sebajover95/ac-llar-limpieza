name: Instalar orden manual AC

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: "!contains(github.event.head_commit.message, '[orden-v16]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar script de orden v15
        shell: python
        run: |
          from pathlib import Path
          import re
          tag = '<script src="/ac-llar-limpieza/orden-ac.js?v=16"></script>'
          for name in ['index.html', 'tablet/index.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<script[^>]+src=["\']/ac-llar-limpieza/orden-ac\.js[^>]*></script>', '', s)
              pos = s.rfind('</body>')
              if pos < 0: raise SystemExit(f'No se encontró </body> en {name}')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')

          p = Path('tablet/index.html')
          s = p.read_text(encoding='utf-8')
          old = re.search(r'async function p3\(\)\{.*?\}var v3=', s, re.S)
          if not old:
              raise SystemExit('No se encontró la función p3 de la tablet')
          new = '''async function p3(){let today=_v(h3());let {data,error}=await supabaseClient.from("limpieza_plan").select("id,fecha,ac_id,tamano,estado").gte("fecha",today).order("fecha",{ascending:!0}).order("prioridad",{ascending:!0}).order("ac_id",{ascending:!0}).limit(500);if(error)throw new Error("No se pudo leer el plan de limpieza: "+error.message);let all=data||[];let pending=all.filter(u=>u.estado!=="terminada");return{fecha:today,items:pending.map(u=>({id:u.ac_id,tamano:u.tamano||"Grande",planId:u.id,planEstado:u.estado}))}}var v3='''
          s = s[:old.start()] + new + s[old.end():]
          needle = '[{id:"pendientes",label:"Pendientes"},{id:"todas",label:"Todas"}]'
          replacement = '[{id:"pendientes",label:`Pendientes (${e.length})`},{id:"todas",label:"Todas"}]'
          if needle not in s:
              raise SystemExit('No se encontró el selector de Pendientes')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validar cambios de Tablet
        shell: bash
        run: |
          grep -q 'label:`Pendientes (${e.length})`' tablet/index.html
          grep -q 'return{fecha:today,items:pending.map' tablet/index.html
          test "$(grep -o 'let C=j=>{l(j),r(\"terminar\")};' tablet/index.html | wc -l)" -eq 1
      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add index.html tablet/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Instalar orden manual AC [orden-v16]"
          git push
