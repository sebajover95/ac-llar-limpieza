name: Fix status labels in SALEN HOY
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-status]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch orden-ac.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('orden-ac.js')
          s=p.read_text(encoding='utf-8')
          marker='async function start()'
          if '__ACLLAR_STATUS_LABELS_V1__' in s:
              raise SystemExit
          fn='''\nasync function statusLabels(){if(window.__ACLLAR_STATUS_LABELS_V1__)return;window.__ACLLAR_STATUS_LABELS_V1__=true;var c=client();if(!c||typeof c.from!=='function')return;try{var q=await c.from('acllar_app_data').select('key,value').eq('key','limpieza-done').maybeSingle();var v={};if(q&&q.data&&q.data.value){try{v=JSON.parse(q.data.value)||{};}catch(e){}}var latest={};if(Array.isArray(v))v.forEach(function(x){if(!Array.isArray(x)||x.length<2)return;var ac=String(x[0]||'').split('|')[0].trim().toUpperCase(),d=String(x[1]||'').slice(0,10);if(/^AC-\\d{3}[A-Z]?$/i.test(ac)&&(!latest[ac]||d>latest[ac]))latest[ac]=d;});var heads=[].slice.call(document.querySelectorAll('*')).filter(function(e){return vis(e)&&/^SALEN HOY\\s*\\(/i.test((e.textContent||'').trim());});heads.forEach(function(h){var hr=h.getBoundingClientRect(),all=[].slice.call(document.querySelectorAll('*'));all.forEach(function(e){if(!vis(e)||e.children.length)return;var t=(e.textContent||'').trim(),m=t.match(/^(AC-\\d{3}[A-Z]?)$/i);if(!m)return;var r=e.getBoundingClientRect();if(r.top<=hr.bottom||r.top>hr.bottom+900)return;var ac=m[1].toUpperCase(),d=latest[ac];if(!d)return;var row=e.parentElement;if(!row)return;[].slice.call(row.querySelectorAll('*')).forEach(function(n){if(n.children.length)return;var z=(n.textContent||'').trim();if(/Se limpia hoy/i.test(z))n.textContent='Limpia desde '+d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);});});});}catch(e){console.warn('status labels',e);}}\n'''
          s=s.replace(marker,fn+'\n'+marker,1)
          s=s.replace('async function start(){await reconcile(today());await render();','async function start(){await reconcile(today());await render();await statusLabels();')
          s=s.replace('await render();if(++n>=60)','await render();await statusLabels();if(++n>=60)')
          s=s.replace('await render();},15000);','await render();await statusLabels();},15000);')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add orden-ac.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix SALEN HOY cleaning status [auto-status]'
          git push
