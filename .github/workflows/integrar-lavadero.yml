name: Integrar Lavadero en la app

on:
  push:
    paths:
      - 'lavadero.js'
      - '.github/workflows/integrar-lavadero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar script Lavadero
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tag = '<script src="./lavadero.js"></script>'
          if './lavadero.js' not in s:
              marker = "</body>"
              if marker not in s:
                  raise SystemExit("No se encontró </body> en index.html")
              s = s.replace(marker, tag + "\n" + marker, 1)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Integrar módulo Lavadero en la app"
            git push
          fi
