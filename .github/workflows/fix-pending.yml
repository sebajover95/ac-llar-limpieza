name: Fix pending logic
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'pending')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Legacy patch disabled
        run: echo disabled
