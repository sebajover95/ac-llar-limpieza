name: Fix planner return cleaning status
on:
  push:
    paths:
      - '.github/workflows/fix-planner-return-cleaning.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch planner logic and validate
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'xe=Ze(ve)===ne?"limpia_hoy":"limpiada",xe==="limpia_hoy"&&hl.has(G.id)&&(xe="limpiada")'
          new = 'xe=Ze(ve)===ne?"limpiada":"limpia_hoy"'
          if old not in s:
              raise SystemExit('PATCH_NOT_APPLIED: planner pattern not found')
          s2 = s.replace(old, new, 1)
          if old in s2 or new not in s2:
              raise SystemExit('PATCH_NOT_APPLIED: validation failed')
          p.write_text(s2, encoding='utf-8')
      - name: Commit app fix and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix planner cleaning status on vehicle return"
          git rm .github/workflows/fix-planner-return-cleaning.yml
          git commit -m "Remove one-shot planner fix workflow"
          git push
