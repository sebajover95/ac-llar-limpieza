name: Fix Tablet and Gestion sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[sync-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('tablet/index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r'async function p3\(\)\{.*?\}var v3=',s,re.S)
          if not old:
              raise SystemExit('No se encontró p3 en tablet/index.html')
          new=r'''async function p3(){let today=_v(h3());let {data,error}=await supabaseClient.from("limpieza_plan").select("id,fecha,ac_id,tamano,estado").gte("fecha",today).order("fecha",{ascending:!0}).order("ac_id",{ascending:!0}).limit(500);if(error)throw new Error("No se pudo leer el plan de limpieza: "+error.message);let all=data||[];let pending=all.filter(u=>u.estado!=="terminada");let fecha=today;let rows=pending.filter(u=>u.fecha===today);if(!rows.length){let dates=[...new Set(pending.map(u=>u.fecha))].sort();if(dates.length){fecha=dates[0];rows=pending.filter(u=>u.fecha===fecha)}}return{fecha,items:rows.map(u=>({id:u.ac_id,tamano:u.tamano||"Grande",planId:u.id,planEstado:u.estado}))}}var v3='''
          s=s[:old.start()]+new+s[old.end()-len('var v3='):]
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='// SYNC-COMPLETED-FROM-CLOUD-V2'
          if marker not in s:
              needle='      let wantedMap=new Map();\n'
              if needle not in s:
                  raise SystemExit('No se encontró wantedMap en index.html')
              block='''      // SYNC-COMPLETED-FROM-CLOUD-V2\n      let cloudCompletedRes=await sb.from("limpiezas").select("ac_id,inicio").eq("estado","terminada");\n      if(cloudCompletedRes.error)throw new Error("No se pudo comprobar las limpiezas terminadas: "+cloudCompletedRes.error.message);\n      let cloudCompletedIds=new Set((cloudCompletedRes.data||[]).filter(S=>S.inicio&&Ze(new Date(S.inicio))===targetDate).map(S=>String(S.ac_id)));\n\n'''
              s=s.replace(needle,block+needle,1)
              if 'hecha:!!S.hecha || cloudCompletedIds.has(String(S.id))' not in s:
                  s=s.replace('hecha:!!S.hecha\n        });','hecha:!!S.hecha || cloudCompletedIds.has(String(S.id))\n        });',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and publish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['index.html','tablet/index.html']:
              s=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',s,re.I)
              for idx,code in enumerate(scripts):
                  if not code.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(code); fn=f.name
                  r=subprocess.run(['node','--check',fn],capture_output=True,text=True)
                  Path(fn).unlink(missing_ok=True)
                  if r.returncode:
                      print(r.stderr)
                      raise SystemExit(f'JavaScript inválido en {name} script {idx}')
          print('VALIDACION OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tablet/index.html
          git rm .github/workflows/fix-tablet-gestion-sync.yml
          git commit -m 'Fix Tablet next pending and Gestion completed sync [sync-fix]'
          git push
